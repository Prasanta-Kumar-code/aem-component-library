name: Build AEM Component Library

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --update-snapshots clean verify -DskipITs
      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aem-component-library-packages
          path: |
            **/target/*.jar
            **/target/*.zip
          if-no-files-found: warn
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aem-component-library-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn